name: Deploy Website to cPanel

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is called master

jobs:
  web-deploy:
    name: Build & Sync files to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Upload compiled files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./dist/        # Change to ./build/ if your framework produces a build/ folder
          server-dir: public_html/
